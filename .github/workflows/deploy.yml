name: Build Data and Deploy to Vercel
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # 也可以設定每天凌晨自動跑一次，更新資料

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 步驟 A: 安裝 psql 客戶端
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      # 步驟 B: 執行資料庫遷移（確保欄位存在）
      - name: Run migrations
        run: psql "${{ secrets.SUPABASE_DB_CONNECTION }}" -f supabase.sql
        timeout-minutes: 5

      # 步驟 C: 執行 Go 程式從 Supabase 抓資料並產生 json（已停用）
      # - name: Generate data.json
      #   run: |
      #     go mod tidy
      #     go run scripts/main.go
      #     ls -R public/  # 檢查 data.json 是否真的在裡面
      #   env:
      #     SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}