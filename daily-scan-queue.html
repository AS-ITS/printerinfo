<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日掃描佇列 | Daily Scan Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --accent: #fb6a7d;
            --accent-strong: #f43f5e;
            --accent-soft: #fff1f4;
            --blue: #3b9cff;
            --ink: #172033;
            --muted: #64748b;
            --surface: #edf1f5;
            --panel: #ffffff;
            --line: #d9dee7;
            --line-soft: #eef1f5;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Plus Jakarta Sans", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: var(--surface);
            color: var(--ink);
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        .dashboard-shell {
            width: min(100%, 1560px);
            margin: 0 auto;
            padding: 0 14px 18px;
            min-width: 0;
        }

        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            border-radius: 8px;
        }

        .header {
            min-height: 100px;
            margin: 0 -14px 12px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            border-radius: 8px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            color: var(--ink);
        }

        .header p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--ink);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 40px;
            color: var(--muted);
            font-weight: 600;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filters {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            background: white;
            min-width: 120px;
        }

        .filters-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .printers-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .printer-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 16px;
        }

        .printer-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .printer-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--ink);
        }

        .printer-location {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .printer-unit {
            font-size: 12px;
            font-weight: 700;
            color: var(--blue);
            background: var(--accent-soft);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        .printer-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
        }

        .material-badges {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .material-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            background: #f1f5f9;
        }

        .material-badge.low {
            background: #fef2f2;
            color: #dc2626;
        }

        .material-badge.medium {
            background: #fffbeb;
            color: #f59e0b;
        }

        .material-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
        }

        .status-badge.normal {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-badge.warning {
            background: #fef3c7;
            color: #d97706;
        }

        .status-badge.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 980px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-actions {
                margin-left: 0;
            }

            .printer-card {
                grid-template-columns: 1fr;
            }

            .printer-stats {
                justify-content: space-between;
            }
        }

        @media (max-width: 760px) {
            .dashboard-shell {
                padding: 0 10px 14px;
            }

            .header h1 {
                font-size: 24px;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-actions {
                margin-left: 0;
                margin-top: 12px;
            }

            .printer-stats {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .material-badges {
                justify-content: center;
            }
        }

        @media (max-width: 520px) {
            .header h1 {
                font-size: 20px;
            }

            .header-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .stat-value {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="login-screen" class="hidden min-h-screen flex items-center justify-center">
        <div class="glass-panel rounded-2xl p-10 text-center max-w-md">
            <h1 class="text-2xl font-bold mb-4">每日掃描佇列</h1>
            <p class="text-slate-400 mb-6">請登入以存取資料</p>
            <button id="google-login-btn" onclick="handleGoogleLogin()" class="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold transition-colors border border-white/20">
                Sign in with Google
            </button>
            <p id="login-error" class="text-red-400 mt-4 text-sm hidden"></p>
        </div>
    </div>

    <div class="dashboard-shell hidden" id="dashboard-content">
        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>載入掃描佇列資料中...</span>
        </div>

        <!-- Error State -->
        <div id="error" class="empty-state hidden">
            <h3>載入失敗</h3>
            <p>無法載入掃描佇列資料，請稍後再試。</p>
        </div>

        <!-- Main Content -->
        <div id="content" class="hidden">
            <!-- Header -->
            <div class="header">
                <div>
                    <h1>每日掃描佇列</h1>
                    <p>今日所有印表機資訊與掃描數字</p>
                </div>
                <div class="header-actions">
                    <button id="signout-btn" onclick="handleSignOut()" class="btn btn-secondary" style="display:none;">Sign out</button>
                    <a href="index.html" class="btn btn-secondary">返回儀表板</a>
                    <button onclick="handleRefresh()" class="btn btn-primary">重新整理</button>
                    <button onclick="exportJSON()" class="btn btn-secondary">匯出 JSON</button>
                    <button onclick="exportCSV()" class="btn btn-secondary">匯出 CSV</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>單位篩選</label>
                    <select id="unit-filter" onchange="applyFilters()">
                        <option value="">全部單位</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>耗材狀態</label>
                    <select id="material-filter" onchange="applyFilters()">
                        <option value="">全部耗材</option>
                        <option value="low">低於 15%</option>
                        <option value="medium">介於 15-50%</option>
                        <option value="high">高於 50%</option>
                    </select>
                </div>
                <div class="filters-actions">
                    <button onclick="resetFilters()" class="btn btn-secondary">重設篩選</button>
                </div>
            </div>

            <!-- Printers List -->
            <div id="printers-container" class="printers-container">
                <!-- Printers will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        let allPrinters = [];
        let filteredPrinters = [];
        let isLoading = false;

        // Supabase 客戶端（從 config.js 載入）
        let supabaseClient;

        // == HTML 轉義 ==
        function escapeHtml(str) {
            if (typeof str !== 'string' || str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 初始化
        async function init() {
            try {
                // 動態載入 Supabase SDK
                if (!window.supabase) {
                    await new Promise((resolve, reject) => {
                        const s = document.createElement('script');
                        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
                        s.onload = resolve;
                        s.onerror = () => reject(new Error('Supabase SDK 載入失敗'));
                        document.head.appendChild(s);
                    });
                }
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                await loadScanQueueData();
                setupEventListeners();
            } catch (error) {
                console.error("初始化失敗:", error);
                showLoading(false);
                showError();
            }
        }

        // 載入掃描佇列資料
        async function loadScanQueueData() {
            if (isLoading) return;
            isLoading = true;

            try {
                // 1. 取得所有印表機
                console.log('[scan-queue] querying printers...');
                const { data: rawPrinters, error: printersError } = await supabaseClient
                    .from('printers')
                    .select('*')
                    .order('unit', { ascending: true })
                    .order('location', { ascending: true });

                if (printersError) { console.error('[scan-queue] printers error:', printersError); throw printersError; }
                console.log('[scan-queue] printers count:', rawPrinters?.length || 0);

                if (!rawPrinters || rawPrinters.length === 0) {
                    allPrinters = [];
                    populateUnitFilter();
                    applyFilters();
                    showLoading(false);
                    return;
                }

                // 2. 取得保留期內每日統計（daily_stats 視圖已計算好 daily_total/daily_print/daily_copy/daily_fax）
                const cutoffDate = getRetentionCutoff();
                console.log('[scan-queue] querying daily_stats since', cutoffDate);
                const { data: dailyStats, error: statsError } = await supabaseClient
                    .from('daily_stats')
                    .select('*')
                    .gte('recorded_at', cutoffDate)
                    .order('recorded_at', { ascending: true });

                if (statsError) { console.error('[scan-queue] daily_stats error:', statsError); throw statsError; }
                console.log('[scan-queue] daily_stats count:', dailyStats?.length || 0);

                // 3. 取得耗材狀態
                console.log('[scan-queue] querying supplies...');
                const { data: rawSupplies, error: suppliesError } = await supabaseClient
                    .from('supplies')
                    .select('*');

                if (suppliesError) { console.error('[scan-queue] supplies error:', suppliesError); throw suppliesError; }
                console.log('[scan-queue] supplies count:', rawSupplies?.length || 0);

                // 4. 取得最近 30 天故障紀錄
                console.log('[scan-queue] querying incidents...');
                const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().substring(0, 10);
                const { data: rawIncidents, error: incidentsError } = await supabaseClient
                    .from('incidents')
                    .select('*')
                    .gte('incident_date', thirtyDaysAgo);

                if (incidentsError) { console.error('[scan-queue] incidents error:', incidentsError); throw incidentsError; }
                console.log('[scan-queue] incidents count:', rawIncidents?.length || 0);

                // 建構資料
                const dailyStatsMap = {};
                (dailyStats || []).forEach(m => {
                    dailyStatsMap[m.ip_address] = m;
                });

                const suppliesMap = {};
                (rawSupplies || []).forEach(s => {
                    if (!suppliesMap[s.printer_id]) suppliesMap[s.printer_id] = {};
                    suppliesMap[s.printer_id][s.supply_type] = s.remaining_percent || 100;
                });

                const incidentsMap = {};
                (rawIncidents || []).forEach(i => {
                    if (!incidentsMap[i.printer_id]) incidentsMap[i.printer_id] = [];
                    incidentsMap[i.printer_id].push({
                        error_code: i.error_code,
                        description: i.description,
                        incident_date: i.incident_date?.substring(0, 10),
                        downtime_minutes: i.downtime_minutes
                    });
                });

                allPrinters = rawPrinters.map(p => {
                    const stats = dailyStatsMap[p.ip_address] || {};
                    const supplies = suppliesMap[p.id] || {};

                    return {
                        ip_address: p.ip_address,
                        location: p.location,
                        model: p.model,
                        unit: p.unit,
                        daily_total: stats.daily_total || 0,
                        daily_print: stats.daily_print || 0,
                        daily_copy: stats.daily_copy || 0,
                        daily_fax: stats.daily_fax || 0,
                        toner_percent: supplies.toner ?? 100,
                        ink_percent: supplies.ink ?? 100,
                        paper_percent: supplies.paper ?? 100,
                        incidents: incidentsMap[p.id] || []
                    };
                });

                populateUnitFilter();
                applyFilters();
                showLoading(false);
            } catch (error) {
                console.error('載入資料失敗:', error);
                throw error;
            } finally {
                isLoading = false;
            }
        }

        // 填充單位篩選器
        function populateUnitFilter() {
            const unitFilter = document.getElementById('unit-filter');
            const units = [...new Set(allPrinters.map(p => p.unit).filter(u => u))];

            units.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                unitFilter.appendChild(option);
            });
        }

        // 應用篩選
        function applyFilters() {
            const unitFilter = document.getElementById('unit-filter').value;
            const materialFilter = document.getElementById('material-filter').value;

            filteredPrinters = allPrinters.filter(printer => {
                // 單位篩選
                if (unitFilter && printer.unit !== unitFilter) {
                    return false;
                }

                // 耗材狀態篩選
                if (materialFilter) {
                    const toner = printer.toner_percent || 100;
                    const ink = printer.ink_percent || 100;
                    const paper = printer.paper_percent || 100;
                    const avgMaterial = (toner + ink + paper) / 3;

                    if (materialFilter === 'low' && avgMaterial >= 15) return false;
                    if (materialFilter === 'medium' && (avgMaterial < 15 || avgMaterial > 50)) return false;
                    if (materialFilter === 'high' && avgMaterial <= 50) return false;
                }

                return true;
            });

            renderPrinters();
        }

        // 重設篩選
        function resetFilters() {
            document.getElementById('unit-filter').value = '';
            document.getElementById('material-filter').value = '';
            applyFilters();
        }

        // 渲染印表機列表
        function renderPrinters() {
            const container = document.getElementById('printers-container');

            if (filteredPrinters.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>沒有符合條件的印表機</h3>
                        <p>請調整篩選條件</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredPrinters.map(printer => {
                const avgMaterial = ((printer.toner_percent || 100) + (printer.ink_percent || 100) + (printer.paper_percent || 100)) / 3;
                const hasLowMaterial = avgMaterial < 15;
                const hasIncidents = (printer.incidents || []).length > 0;

                let statusClass = 'normal';
                if (hasLowMaterial || hasIncidents) {
                    statusClass = 'warning';
                }

                return `
                    <div class="printer-card">
                        <div class="printer-info">
                            <div class="printer-name">${escapeHtml(printer.location)} ${escapeHtml(printer.model || '')}</div>
                            <div class="printer-location">IP: ${escapeHtml(printer.ip_address)}</div>
                            <div class="printer-unit">${escapeHtml(printer.unit) || '未知單位'}</div>
                        </div>
                        <div class="printer-stats">
                            <div class="stat-item">
                                <div class="stat-value">${(printer.daily_total || 0).toLocaleString()}</div>
                                <div class="stat-label">今日總數量</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${(printer.daily_print || 0).toLocaleString()}</div>
                                <div class="stat-label">列印</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${(printer.daily_copy || 0).toLocaleString()}</div>
                                <div class="stat-label">影印</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${(printer.daily_fax || 0).toLocaleString()}</div>
                                <div class="stat-label">傳真</div>
                            </div>
                            <div class="material-badges">
                                <div class="material-badge ${avgMaterial < 15 ? 'low' : avgMaterial < 50 ? 'medium' : ''}">
                                    <div class="material-indicator" style="background: ${getSupplyColor('toner', printer.toner_percent)}"></div>
                                    碳粉: ${printer.toner_percent}%
                                </div>
                                <div class="material-badge ${avgMaterial < 15 ? 'low' : avgMaterial < 50 ? 'medium' : ''}">
                                    <div class="material-indicator" style="background: ${getSupplyColor('ink', printer.ink_percent)}"></div>
                                    墨水: ${printer.ink_percent}%
                                </div>
                                <div class="material-badge ${avgMaterial < 15 ? 'low' : avgMaterial < 50 ? 'medium' : ''}">
                                    <div class="material-indicator" style="background: ${getSupplyColor('paper', printer.paper_percent)}"></div>
                                    紙張: ${printer.paper_percent}%
                                </div>
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${hasLowMaterial ? '⚠️' : '✓'} ${statusClass === 'normal' ? '正常' : '注意'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 取得耗材顏色
        function getSupplyColor(type, percent) {
            if (percent < 15) return '#dc2626';
            if (percent < 50) return '#f59e0b';
            return '#22c55e';
        }

        // 處理重新整理
        async function handleRefresh() {
            await loadScanQueueData();
        }

        // 匯出 JSON
        function exportJSON() {
            const dataStr = JSON.stringify(filteredPrinters, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `daily-scan-queue-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 匯出 CSV
        function exportCSV() {
            const headers = ['IP 位址', '地點', '型號', '單位', '今日總數量', '今日列印', '今日影印', '今日傳真', '碳粉百分比', '墨水百分比', '紙張百分比', '狀態'];
            const rows = filteredPrinters.map(printer => [
                printer.ip_address,
                printer.location || '',
                printer.model || '',
                printer.unit || '',
                printer.daily_total || 0,
                printer.daily_print || 0,
                printer.daily_copy || 0,
                printer.daily_fax || 0,
                printer.toner_percent || 100,
                printer.ink_percent || 100,
                printer.paper_percent || 100,
                getPrinterStatus(printer)
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `daily-scan-queue-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 取得印表機狀態
        function getPrinterStatus(printer) {
            const avgMaterial = ((printer.toner_percent || 100) + (printer.ink_percent || 100) + (printer.paper_percent || 100)) / 3;
            const hasLowMaterial = avgMaterial < 15;
            const hasIncidents = (printer.incidents || []).length > 0;

            if (hasLowMaterial || hasIncidents) {
                return '注意';
            }
            return '正常';
        }

        // 設置事件監聽器
        function setupEventListeners() {
            // 可以添加額外的事件監聽器
        }

        // 顯示載入狀態
        function showLoading(show) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            if (show) {
                loading.classList.remove('hidden');
                error.classList.add('hidden');
                content.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
                error.classList.add('hidden');
                content.classList.remove('hidden');
            }
        }

        // 顯示錯誤狀態
        function showError() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            loading.classList.add('hidden');
            error.classList.remove('hidden');
            content.classList.add('hidden');
        }

        // == 認證邏輯 ==
        let supabaseClient = null;

        async function handleGoogleLogin() {
            const btn = document.getElementById('google-login-btn');
            btn.disabled = true;
            btn.innerHTML = '登入中...';
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
            if (error) {
                const errEl = document.getElementById('login-error');
                errEl.textContent = error.message;
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Sign in with Google';
            }
        }

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function initAuth() {
            if (!window.supabase) {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
                await new Promise((resolve) => { s.onload = resolve; s.onerror = resolve; document.head.appendChild(s); });
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                const signoutBtn = document.getElementById('signout-btn');
                if (signoutBtn) signoutBtn.style.display = 'inline-block';
                // 繼續載入內容
                init();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-content').classList.add('hidden');
            }
        }

        // 啟動應用
        document.addEventListener('DOMContentLoaded', initAuth);
    </script>
</body>
</html>
